<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Methods and Loops</title>
  </head>
  <body>
    <h2>Methods and Loops</h2>
<p>Numbers from 1 to 10</p>
<p id="numbers"></p>
<p id="random"></p>
<p id="day"></p>

<script>
  // PART 1: the numbers 1 to 10
  var text="";
  for (i = 1; i <= 10; i++)
  {
    text+=i+"<br>";
  }
document.getElementById("numbers").innerHTML = text;

  // PART 2: a random whole number
var number=Math.random();
number*= 100;

document.getElementById("random").innerHTML=Math.floor(number);


  // PART 3: today's day number
var todaysnumber= new Date().getDay();
document.getElementById("day").innerHTML="Todays day number is "+ todaysnumber;
</script>

  </body>
</html>
